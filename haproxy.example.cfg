# Changed for My Bastion (2026). Derived from sol1/rustguac, Apache-2.0; see NOTICE.
# HAProxy example configuration for mybastion
#
# This config terminates TLS at HAProxy and proxies to mybastion on localhost.
# mybastion listens on 127.0.0.1:8089 with its own TLS (double encryption on
# loopback — belt and suspenders). Adjust "verify none" to "verify required
# ca-file /path/to/ca.pem" if using a real CA-signed cert for mybastion.
#
# WebSocket support requires tunnel timeout for long-lived connections.

global
    log /dev/log local0
    log /dev/log local1 notice
    # Admin socket, for runtime inspection (show stat, show sess, …).
    stats socket /run/haproxy/admin.sock mode 0660 level admin user haproxy group haproxy
    user haproxy
    group haproxy
    daemon

    # Modern TLS defaults
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull

    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # WebSocket/tunnel connections need a long timeout — sessions can last hours.
    # This should be >= mybastion's session_max_duration_secs (default 8h).
    timeout tunnel  8h

    # Abort slow client sends (protects against slowloris)
    timeout http-request 10s
    timeout http-keep-alive 5s

frontend https
    bind *:443 ssl crt /etc/ssl/private/mybastion.pem alpn h2,http/1.1
    bind *:80

    mode http

    # Redirect HTTP → HTTPS
    http-request redirect scheme https unless { ssl_fc }

    # Forward client IP to mybastion (used by rate limiting and audit logging).
    # Delete any incoming X-Forwarded-For first to prevent spoofing, then let
    # HAProxy add the real client IP as a fresh single-valued header.
    http-request del-header X-Forwarded-For
    option forwardfor
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    #
    # mybastion must trust HAProxy's source IP to honour X-Forwarded-For.
    # Add this to your mybastion.toml:
    #   trusted_proxies = ["127.0.0.1/32"]

    # HSTS header (HAProxy layer — mybastion also sets this when TLS is enabled)
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains" if { ssl_fc }

    # ── Route classification ─────────────────────────────────────────────

    # Match requests to this mybastion instance by hostname
    acl is_mybastion hdr(host) -i console.example.com

    # ── Routing rules ────────────────────────────────────────────────────

    # Everything for this hostname goes to My Bastion, which has its own auth.
    use_backend mybastion if is_mybastion

    default_backend denied

backend mybastion
    mode http
    balance roundrobin

    # Health check against the unauthenticated /api/health endpoint.
    option httpchk GET /api/health
    http-check expect status 200

    # mybastion on loopback with TLS. Use "verify none" for self-signed certs,
    # or "verify required ca-file /etc/mybastion/tls/cert.pem" for strict checking.
    server mybastion 127.0.0.1:8089 ssl verify none check inter 30s

backend denied
    mode http
    # Custom 403 page. The .http file includes full HTTP headers + HTML body.
    errorfile 403 /etc/haproxy/errors/403.http
    http-request deny deny_status 403
